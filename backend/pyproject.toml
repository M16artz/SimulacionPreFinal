[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simulacion-restaurante"
version = "1.1.0"
description = "Simulador modular de restaurante con datos sintéticos"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "simpy>=4.1,<5", "numpy>=2.2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2", "pyyaml>=6,<7"]

[project.optional-dependencies]
pruebas = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
restaurante = "restaurante.consola:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
